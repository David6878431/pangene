[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pangene-workflows"
version = "0.1.0"
description = "Configurable pangene bioinformatics workflows with Docker and a Python CLI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
pangene-workflows = "pangene_workflows.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
